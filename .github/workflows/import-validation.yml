name: Import compression validation
on:
  push:
    branches: [validation/import-compression]
permissions:
  contents: read
jobs:
  import:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.12.17', '1.25.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Toolchain
        run: go version
      - name: Import regressions and controls
        run: go test -count=1 -race -v -run TestImport ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Full Linux suite
        if: runner.os == 'Linux'
        run: go test -count=1 -race ./...
